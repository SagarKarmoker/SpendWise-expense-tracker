version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: spend-tracker-db
    environment:
      POSTGRES_USER: ${DB_USER:-spendtracker}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-spendtracker}
      POSTGRES_DB: ${DB_NAME:-spendtracker}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-spendtracker} -d ${DB_NAME:-spendtracker}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - spend-tracker-network

  # Redis Cache (optional but included for future use)
  redis:
    image: redis:7-alpine
    container_name: spend-tracker-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - spend-tracker-network

  # NestJS API
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: spend-tracker-api
    environment:
      NODE_ENV: production
      PORT: ${API_PORT:-3000}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-spendtracker}
      DB_PASSWORD: ${DB_PASSWORD:-spendtracker}
      DB_NAME: ${DB_NAME:-spendtracker}
      JWT_SECRET: ${JWT_SECRET:-your-secret-key-change-this-in-production}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-24h}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - "${API_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - spend-tracker-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # React Web App
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: spend-tracker-web
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      - api
    networks:
      - spend-tracker-network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  spend-tracker-network:
    driver: bridge
