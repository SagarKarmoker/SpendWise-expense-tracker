version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: spend-tracker-db
    environment:
      POSTGRES_USER: spendtracker
      POSTGRES_PASSWORD: spendtracker
      POSTGRES_DB: spendtracker
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: spend-tracker-redis
    ports:
      - "6379:6379"

volumes:
  postgres_data:
